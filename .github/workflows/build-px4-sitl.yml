name: Build PX4 SITL Bundles

# Builds the PX4 SITL bundles ArduDeck's in-app PX4 SITL tab downloads from,
# for every supported platform (Linux x64, macOS arm64, macOS x64) in one
# dispatch. PX4 has no standalone prebuilt SITL binary, so each bundle carries
# the px4 executable + its ROMFS data + jMAVSim + a version-matched launcher
# (see scripts/build-px4-sitl-bundle.sh).
#
# ArduDeck downloads from:
#   https://github.com/rubenCodeforges/ardudeck/releases/download/{tag}/px4-sitl-{track}-{platform}.tar.gz
# The {tag} MUST match PX4_SITL_RELEASE_TAG in
#   apps/desktop/src/main/sitl/px4-sitl-downloader.ts

on:
  workflow_dispatch:
    inputs:
      track:
        description: 'Release track (stable, beta, dev)'
        required: true
        default: 'stable'
      px4_ref:
        description: 'PX4-Autopilot git ref (tag or branch). Leave blank to use the track default.'
        required: false
        default: ''
      release_tag:
        description: 'GitHub release tag to upload to (must match the app)'
        required: true
        default: 'px4-sitl-vmaster-20260814'

permissions:
  contents: write

jobs:
  # Create the release once, up front, so the parallel build jobs only upload
  # (no race between three jobs each trying to create the same release).
  prepare-release:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.release_tag }}"
          gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "${{ github.repository }}" \
                 --title "PX4 SITL bundles" \
                 --notes "Prebuilt PX4 SITL bundles for ArduDeck's in-app simulator." \
                 --prerelease

  build:
    needs: prepare-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux-x64
          - runner: macos-14      # Apple Silicon (arm64)
            platform: macos-arm64
          - runner: macos-13      # Intel (x64)
            platform: macos-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - name: Checkout ArduDeck (for the build script)
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install jMAVSim + build deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y default-jdk ant cmake ninja-build g++ git make

      - name: Install jMAVSim + build deps (macOS)
        if: runner.os == 'macOS'
        run: |
          # We do NOT run PX4's Tools/setup/macos.sh: it taps px4/px4 and installs
          # px4-dev (a NuttX cross toolchain we don't need for a host SITL build),
          # and modern Homebrew refuses that untrusted tap. Install the host-build
          # deps directly instead, and the build job runs the script with
          # --skip-setup. gnu-sed/coreutils cover PX4 build scripts that assume GNU.
          brew install ant cmake ninja gnu-sed coreutils || true
          brew install --cask temurin || true

      - name: Build and upload PX4 SITL bundle (${{ matrix.platform }})
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x scripts/build-px4-sitl-bundle.sh
          ARGS=(--track "${{ inputs.track }}" --tag "${{ inputs.release_tag }}" --upload)
          if [ -n "${{ inputs.px4_ref }}" ]; then ARGS+=(--ref "${{ inputs.px4_ref }}"); fi
          # macOS: skip PX4's brew-tap setup script (see deps step above).
          if [ "${{ runner.os }}" = "macOS" ]; then ARGS+=(--skip-setup); fi
          scripts/build-px4-sitl-bundle.sh "${ARGS[@]}"
